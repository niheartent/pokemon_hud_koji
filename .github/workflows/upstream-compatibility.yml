name: Check latest Xianjiu core
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:upstream
      - run: node tests/upstream-compatibility.cjs
        env:
          UPSTREAM_CANDIDATE: artifacts/upstream-candidate.js
      - run: node tests/upgrade-from-published.cjs
        env:
          UPSTREAM_CANDIDATE: artifacts/upstream-candidate.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-compatibility
          path: |
            artifacts/upstream-compatibility.json
            artifacts/upstream-browser-validation.json
            artifacts/published-upgrade-tests.json
